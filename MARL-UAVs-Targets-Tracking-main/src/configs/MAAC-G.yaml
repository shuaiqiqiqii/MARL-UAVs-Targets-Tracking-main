exp_name: MAAC-G
result_dir: ../results/MAAC-G

#新增cooperative用于表示协作强度  30% 权重来自全局 / 协作信息，70% 权重来自自身局部信息
# 第一个cuda device的编号, -1代表cpu
first_device: 0
# cuda device的数量, 使用cpu时无效
gpus: 1
seed: 42
cooperative: 0.3
environment:
  n_uav: 10
  m_targets: 10
  n_obstacles: 5
  x_max: 2000
  y_max: 2000
  na: 12  # 离散化动作空间维数

uav:
  dt: 1
  v_max: 20
  h_max: 6  # 表示 pi / 6
  dc: 500
  dp: 200
  do: 300
  alpha: 0.6
  beta: 0.2
  gamma: 0.2
  omega: 0.2 #新增碰撞惩罚系数

target:
  v_max: 5
  h_max: 6  # 表示 pi / 6

obstacle:
  v_max: 5
  h_max: 6

actor_critic:
  buffer_size: 1000000
  sample_size: 0  # 表示每次采样的大小为每个epoch的step数
  actor_lr: 1e-4
  critic_lr: 5e-4
  hidden_dim: 128
  gamma: 0.95
